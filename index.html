<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Feedback</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen py-24 px-4">

    <div class="w-full max-w-2xl mx-auto">
        <div id="feedback-form-container" class="bg-white p-8 rounded-2xl shadow-lg transition-all duration-500">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Avaliação do Portal</h1>
                <p class="text-gray-500 mt-2">Seu feedback é muito importante para nós!</p>
            </div>
            
            <form id="feedbackForm">
                <!-- Pergunta 1: Avaliação Geral -->
                <div class="mb-6">
                    <label class="block text-md font-medium text-gray-700 mb-2">1. Em uma escala de 1 a 5, como você avalia sua experiência geral no portal?</label>
                    <p class="text-sm text-gray-500 mb-3">(1 = Nada Satisfeito, 5 = Totalmente Satisfeito)</p>
                    <div class="flex justify-start space-x-2 sm:space-x-4">
                        <label for="rating-1" class="rating-label">
                            <input type="radio" id="rating-1" name="avaliacaoGeral" value="1" class="sr-only" required>
                            <span class="rating-bubble">1</span>
                        </label>
                        <label for="rating-2" class="rating-label">
                            <input type="radio" id="rating-2" name="avaliacaoGeral" value="2" class="sr-only">
                            <span class="rating-bubble">2</span>
                        </label>
                        <label for="rating-3" class="rating-label">
                            <input type="radio" id="rating-3" name="avaliacaoGeral" value="3" class="sr-only">
                            <span class="rating-bubble">3</span>
                        </label>
                        <label for="rating-4" class="rating-label">
                            <input type="radio" id="rating-4" name="avaliacaoGeral" value="4" class="sr-only">
                            <span class="rating-bubble">4</span>
                        </label>
                        <label for="rating-5" class="rating-label">
                            <input type="radio" id="rating-5" name="avaliacaoGeral" value="5" class="sr-only">
                            <span class="rating-bubble">5</span>
                        </label>
                    </div>
                </div>

                <!-- Pergunta 2: Clareza do Conteúdo -->
                <div class="mb-6">
                    <label for="clarezaConteudo" class="block text-md font-medium text-gray-700">2. O conteúdo sobre IA Generativa, Gemini e NotebookLM foi claro e de fácil compreensão?</label>
                    <textarea id="clarezaConteudo" name="clarezaConteudo" rows="4" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Sua resposta..." required></textarea>
                </div>

                <!-- Pergunta 3: Parte mais útil -->
                <div class="mb-6">
                    <label for="parteMaisUtil" class="block text-md font-medium text-gray-700">3. O que você achou mais útil ou interessante em sua jornada de aprendizado?</label>
                    <textarea id="parteMaisUtil" name="parteMaisUtil" rows="4" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Sua resposta..." required></textarea>
                </div>

                <!-- Pergunta 4: Sugestões -->
                <div class="mb-8">
                    <label for="sugestoes" class="block text-md font-medium text-gray-700">4. Você tem alguma sugestão para melhorarmos o portal?</label>
                    <textarea id="sugestoes" name="sugestoes" rows="4" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Sua resposta..."></textarea>
                </div>
                
                <!-- Botão de Envio -->
                <div class="text-center">
                    <button type="submit" id="submit-button" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-300 ease-in-out transform hover:scale-105">
                        Enviar Feedback
                    </button>
                </div>
            </form>
        </div>

        <!-- Mensagem de Sucesso -->
        <div id="success-message" class="hidden text-center bg-white p-8 rounded-2xl shadow-lg">
            <svg class="w-16 h-16 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-2xl font-bold text-gray-800 mt-4">Obrigado!</h2>
            <p class="text-gray-600 mt-2">Seu feedback foi enviado com sucesso.</p>
        </div>

        <!-- Mensagem de Erro -->
        <div id="error-message" class="hidden text-center">
             <p class="text-red-500">Ocorreu um erro ao enviar. Tente novamente.</p>
        </div>
    </div>

    <style>
        .rating-label {
            cursor: pointer;
        }
        .rating-bubble {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f3f4f6; /* gray-100 */
            color: #374151; /* gray-700 */
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }
        .rating-label:hover .rating-bubble {
            background-color: #dbeafe; /* blue-100 */
            border-color: #3b82f6; /* blue-500 */
        }
        input:checked + .rating-bubble {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            transform: scale(1.1);
        }
    </style>

    <script>
        // IMPORTANTE: Cole aqui a URL do seu Web App do Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2Ciz4chWktNXcd9pCJnhXgZ9z5oybb6kBvkB9dFSsB8SjX2fZfElXGBVNsv9ZYrpCUA/exec'; 

        const form = document.getElementById('feedbackForm');
        const submitButton = document.getElementById('submit-button');
        const formContainer = document.getElementById('feedback-form-container');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL === 'URL_DO_SEU_SCRIPT_AQUI') {
                alert('Por favor, configure a URL do Google Apps Script no código HTML.');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';
            errorMessage.classList.add('hidden');

            const formData = new FormData(form);
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === 'success'){
                    formContainer.classList.add('hidden');
                    successMessage.classList.remove('hidden');
                } else {
                    throw new Error('Ocorreu um erro no servidor.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = 'Enviar Feedback';
            });
        });
    </script>
</body>
</html>
